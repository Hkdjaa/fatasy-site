{% extends 'base.html' %}
{% block content %}
<section class="section contact-portal">
    <h1>Enchanted Correspondence</h1>
    <p class="lead">Send a message through the portal — the keepers will receive it.</p>
    <div class="portal-wrap">
        <div class="rune rune-left">ᚠ</div>
        <form method="post" action="/contact" class="contact-form card">
            <input name="name" placeholder="Your Name" required />
            <input name="email" placeholder="Your Email" required />
            <textarea name="message" placeholder="Your Message" required></textarea>
            <button type="submit" class="glow send-btn">Send Through Portal</button>
        </form>
        <div class="rune rune-right">ᛟ</div>
    </div>
    <div id="send-confirm" class="modal">
        <div class="modal-content">
            <p>Your message has passed the wards. A keeper will reply in due time.</p>
            <div class="close-btn" onclick="closeModal('send-confirm')">Close</div>
        </div>
    </div>
</section>
{% endblock %}
