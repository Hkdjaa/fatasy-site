<!DOCTYPE html>
<html>
<head>
<title>Contact</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="{{ url_for('static', filename='script.js') }}"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
</head>
<body style="background: #000;">

<!-- NAV -->
<nav>
    <div class="logo">OBSIDIAN</div>
    <div>
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
    </div>
</nav>

<!-- FORMULAIRE CENTRÉ -->
<div style="display:flex; justify-content:center; align-items:center; min-height:100vh; padding-top:4rem;">
    <div style="background: linear-gradient(to bottom right, #1e0a38, #000000); padding:3rem; border-radius:2rem; border:1px solid rgba(147,51,234,0.3); width:400px; box-shadow:0 15px 35px rgba(0,0,0,0.5); text-align:center;">
        <h2 style="color:#9333ea; font-size:2.5rem;">Contact Us</h2>
        <p style="color:#c4c4c4; margin-top:0.5rem;">Send a message and step into the magical realms of Obsidian.</p>

        <form style="margin-top:2rem; display:flex; flex-direction:column; gap:1rem;" onsubmit="event.preventDefault(); alert('Message sent! A magical raven flies with your message 🦉✨');">
            <input type="text" placeholder="Name">
            <input type="email" placeholder="Email">
            <textarea placeholder="Message" style="height:6rem;"></textarea>
            <button type="submit">Send</button>
        </form>
    </div>
</div>

</body>
</html>
